# =============================================================================
# StockSpace Nginx 反向代理（容器版 / 子路径部署示例）
# =============================================================================
# 两条部署路线都适用：
#   A. 站点根路径：location / { proxy_pass http://app:8770; }
#   B. 子路径（如 /stock-space/）：把下面的注释打开并按需改前缀。
#
# 应用自身**完全使用相对地址**（前端资源 ./assets/...，接口 api/...），
# 因此只要代理把前缀正确转发，前端不需要改任何一行代码。
# =============================================================================

upstream stock_space_backend {
    # Docker Compose 里用服务名；直接部署时改成 127.0.0.1:8770
    server app:8770;
    keepalive 16;
}

# 上游扫描类接口可能运行数十秒（首次拉全市场日线），因此超时要放宽
proxy_connect_timeout 15s;
proxy_send_timeout 300s;
proxy_read_timeout 300s;

server {
    listen 80;
    server_name _;

    # 安全响应头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 8m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;

    # ---------------------------------------------------------------- 方案 A
    # 站点根路径部署（默认）
    location / {
        proxy_pass http://stock_space_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # 静态资源可长缓存（文件名带内容哈希；HTML 由后端强制 no-store）
    location /assets/ {
        proxy_pass http://stock_space_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        access_log off;
    }

    # ---------------------------------------------------------------- 方案 B
    # 子路径部署（如 https://host/stock-space/）。启用步骤：
    #   1) 注释掉上面的 location / 与 location /assets/
    #   2) 打开下面两段
    #
    # location = /stock-space { return 301 /stock-space/; }
    # location ^~ /stock-space/ {
    #     proxy_pass http://stock_space_backend/;   # 末尾 / 会去掉前缀
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_set_header X-Forwarded-Prefix /stock-space/;
    #     proxy_set_header Connection "";
    # }
}

