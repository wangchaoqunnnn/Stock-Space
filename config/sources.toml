sector = ["https://proxy.finance.qq.com/cgi/cgi-bin/rank/pt/getRank"]
sector_members = ["https://proxy.finance.qq.com/cgi/cgi-bin/rank/hs/getBoardRankList"]
code_list = ["https://proxy.finance.qq.com/cgi/cgi-bin/rank/hs/getBoardRankList"]

