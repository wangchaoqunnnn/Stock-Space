# =============================================================================
# StockSpace 数据源目录（唯一允许出现第三方地址的文件）
# =============================================================================
# 设计原则：代码里不出现任何上游域名，全部收敛到本文件；
# 运行期可通过 config/sources.local.toml 或环境变量 SS_SOURCES__...__URLS 覆盖，
# 也可以在网页「数据源」页面手工输入新地址（写入 data/runtime_settings.json）。
#
# urls 为“候选地址列表”：同一能力下第一个失败会自动尝试下一个，因此
# 单一入口被封禁不会导致能力整体不可用（要求：不得引用固定地址）。
#
# ⚠️ 入网环境差异实测（2026-09，本机）：
#   * push2.eastmoney.com / push2his.eastmoney.com 在部分网络被 TLS 层阻断
#     （RemoteDisconnected），而 **push2delay.eastmoney.com 镜像可达**；
#   * 腾讯 web.ifzq.gtimg.cn 的 fqkline 入口返回 HTTP 501，
#     而 **proxy.finance.qq.com/ifzqgtimg/.../newfqkline 与 ifzq.gtimg.cn 可达**；
#   * 新浪列表接口高频访问会返回 HTTP 456（封禁约 10 分钟），实时行情不受影响；
#   * 网易行情域名在本机 DNS 解析失败，故未纳入；
#   * 东财 K 线在 delay 镜像上返回空 klines，故不作为 K 线主源。
#   因此候选列表**顺序即容灾优先级**：把实测可达的入口排在前面。
# =============================================================================

[providers.eastmoney]
label = "东方财富"
priority = 90
enabled = true
requires_login = false
homepage = "https://quote.eastmoney.com/"
note = "A股快照/榜单/板块/资金流/涨停池覆盖最全的主源；主域名在部分网络不可达时自动走 delay 镜像。"

[providers.eastmoney.urls]
# 全市场分页快照（沪深京 A 股）。delay 镜像优先，主域名作为备选。
snapshot = [
  "https://push2delay.eastmoney.com/api/qt/clist/get",
  "https://push2.eastmoney.com/api/qt/clist/get",
]
# 单只行情 / 指数 / 批量行情
quote = [
  "https://push2delay.eastmoney.com/api/qt/stock/get",
  "https://push2.eastmoney.com/api/qt/stock/get",
]
# 批量行情走 ulist.np（一次最多 80 个 secid）
batch_quote = [
  "https://push2delay.eastmoney.com/api/qt/ulist.np/get",
  "https://push2.eastmoney.com/api/qt/ulist.np/get",
]
# 榜单（涨跌幅/成交额/换手率/涨速）
rank = [
  "https://push2delay.eastmoney.com/api/qt/clist/get",
  "https://push2.eastmoney.com/api/qt/clist/get",
]
# 日/周/月 K 线。⚠️ 实测本机 push2his / push2 域名被 TLS 层阻断, 而 delay 镜像
# 虽然可达但 klines 恒为空数组 → 东财在本环境下**取不到 K 线**, 因此放在最后。
# 真正扛 K 线的是腾讯(newfqkline)、新浪(money)与同花顺(按年打包)。
kline = [
  "https://push2his.eastmoney.com/api/qt/stock/kline/get",
  "https://push2.eastmoney.com/api/qt/stock/kline/get",
]
# 分时
minute = [
  "https://push2his.eastmoney.com/api/qt/stock/trends2/get",
  "https://push2delay.eastmoney.com/api/qt/stock/trends2/get",
]
# 板块列表 / 板块成分股
sector = [
  "https://push2delay.eastmoney.com/api/qt/clist/get",
  "https://push2.eastmoney.com/api/qt/clist/get",
]
sector_members = [
  "https://push2delay.eastmoney.com/api/qt/clist/get",
  "https://push2.eastmoney.com/api/qt/clist/get",
]
# 个股资金流
money_flow = [
  "https://push2delay.eastmoney.com/api/qt/stock/fflow/kline/get",
  "https://push2.eastmoney.com/api/qt/stock/fflow/kline/get",
]
# 板块资金流排名
sector_flow = [
  "https://push2delay.eastmoney.com/api/qt/clist/get",
  "https://push2.eastmoney.com/api/qt/clist/get",
]
# 涨停/跌停/炸板池（push2ex 实测可达）
limit_up_pool = ["https://push2ex.eastmoney.com/getTopicZTPool"]
broken_pool = ["https://push2ex.eastmoney.com/getTopicZBPool"]
# 沪深京 A 股代码表
code_list = [
  "https://push2delay.eastmoney.com/api/qt/clist/get",
  "https://push2.eastmoney.com/api/qt/clist/get",
]
# 股票检索（代码/名称模糊搜索）
search = ["https://searchapi.eastmoney.com/api/suggest/get"]
# 市场宽度（涨跌家数）
breadth = [
  "https://push2delay.eastmoney.com/api/qt/clist/get",
  "https://push2.eastmoney.com/api/qt/clist/get",
]
# 人气榜（关注度代理指标）
attention = ["https://emappdata.eastmoney.com/stockrank/getAllCurrentList"]
# 财报业绩报表
finance = ["https://datacenter-web.eastmoney.com/api/data/v1/get"]

[providers.sina]
label = "新浪财经"
priority = 80
enabled = true
requires_login = false
homepage = "https://finance.sina.com.cn/"
note = "实时行情稳定；全市场列表最完整但高频会被 456 限流（约 10 分钟），日K接口可用。"

[providers.sina.urls]
snapshot = [
  "https://vip.stock.finance.sina.com.cn/quotes_service/api/json_v2.php/Market_Center.getHQNodeData",
]
quote = ["https://hq.sinajs.cn/list="]
# 日K：money 与 quotes.sina.cn 两个等价入口互为备份（实测均可用）
kline = [
  "https://money.finance.sina.com.cn/quotes_service/api/json_v2.php/CN_MarketData.getKLineData",
  "https://quotes.sina.cn/cn/api/json_v2.php/CN_MarketDataService.getKLineData",
]
minute = ["https://quotes.sina.cn/cn/api/json_v2.php/CN_MarketDataService.getKLineData"]
sector = ["https://vip.stock.finance.sina.com.cn/quotes_service/api/json_v2.php/Market_Center.getHQNodeData"]
sector_members = ["https://vip.stock.finance.sina.com.cn/quotes_service/api/json_v2.php/Market_Center.getHQNodeData"]
code_list = ["https://vip.stock.finance.sina.com.cn/quotes_service/api/json_v2.php/Market_Center.getHQNodeData"]
# 个股资金流（来源：92KeBi `real/moneyflow.py`）。
# 这是 money_flow 能力**唯一非东财的源** —— 此前该能力只有 eastmoney 一个候选，
# 东财一旦被阻断就完全没有兜底，与"多源容灾"的要求不符。
# 实测(2026-09)：HTTP 200 + 4000+ 条日度记录。
# ⚠️ 口径差异：本接口**只有日度数据**（最新一条通常是上一交易日，盘后更新），
# 而东财 push2 fflow 是盘中实时；两源的"主力"分级口径也不完全一致。
money_flow = [
  "https://vip.stock.finance.sina.com.cn/quotes_service/api/json_v2.php/MoneyFlow.ssl_qsfx_zjlrqs",
]
# 7×24 快讯
news_flash = ["https://zhibo.sina.com.cn/api/zhibo/feed"]

